services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?Please set OPENROUTER_API_KEY in your .env file}
    # volumes:
      # Mount local code for development (optional, uncomment if needed)
      # - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80" # Map host port 3000 to container port 80 (nginx default)
    depends_on:
      - backend
    environment:
      - REACT_APP_API_BASE_URL=http://backend:8000/api
      - REACT_APP_WS_BASE_URL=ws://backend:8000/ws
